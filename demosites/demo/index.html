<body>
<div class="shell">
<header class="header">
  <a href="/demosites/" class="brand"><div class="logo">CG</div><span><strong>DemoSites</strong><small>15 sek produktdemo</small></span></a>
  <div class="header-right"><span class="badge">KUN SYNTETISKE DEMO-DATA</span><a href="/demosites/">Tilbake</a></div>
</header>
<main class="layout">
  <section class="copy">
    <p class="eyebrow" id="eyebrow">AUTO DEMO · 15S</p>
    <h1 id="heading">1. Legg inn bedriften</h1>
    <p>Denne demoen viser kundereisen uten å bruke ekte kundedata, nettsider, ordre eller betalinger. Alt som vises er laget kun for presentasjon.</p>
    <div class="actions"><button id="restart">↻ Start på nytt</button></div>
    <div class="progress"><span id="progress" style="width:0%"></span></div>
    <div class="labels"><span id="l0" class="active">Input</span><span id="l1">Preview</span><span id="l2">AI-bot</span><span id="l3">Kjøp</span></div>
  </section>
  <section class="device">
    <div class="screen">
      <div class="topbar"><div class="mini-brand"><div class="mini-logo">CG</div><span><strong>DemoSites</strong><small>Syntetisk demo</small></span></div><span class="demo-label">DEMO</span></div>
      <div class="panel" id="panel"></div>
    </div>
  </section>
</main>
</div>
<script>
const TOTAL=15000, STEP=TOTAL/4;
let started=Date.now(), playing=true;
const headings=["1. Legg inn bedriften","2. AI bygger prøvesiden","3. AI-resepsjonist fanger behovet","4. Kunden kan velge og kjøpe"];
const panel=document.getElementById("panel"), heading=document.getElementById("heading"), progress=document.getElementById("progress"), eyebrow=document.getElementById("eyebrow");
const labels=[0,1,2,3].map(i=>document.getElementById("l"+i));
function render(step){
 heading.textContent=headings[step];
 labels.forEach((el,i)=>el.classList.toggle("active",i===step));
 if(step===0) panel.innerHTML='<h2>Ny prøveside</h2><p class="muted">Kunden legger inn det viktigste. Resten er demo-generert.</p><div class="form"><div class="field"><span>Bedriftsnavn</span><strong>Nordic VVS Demo AS</strong></div><div class="field"><span>Nettadresse</span><strong>nordic-vvs-demo.example</strong></div><div class="field"><span>Bransje</span><strong>Rørlegger · lokale tjenester</strong></div><div class="primary">Lag gratis prøveside →</div></div><p class="synthetic">Ingen av disse opplysningene tilhører en ekte kunde.</p>';
 if(step===1) panel.innerHTML='<h2>Prøvesiden er klar</h2><p class="muted">AI har laget struktur, tekst og visuell retning fra demo-input.</p><div class="browser"><div class="browserbar"><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div class="preview"><p style="font-size:11px;font-weight:900;color:#0f766e;text-transform:uppercase;letter-spacing:.12em">Nordic VVS Demo</p><h3>Rørleggerhjelp når du trenger det</h3><p>Service, lekkasjer og oppgraderinger for bolig og bedrift. Demo-tekst, demo-priser og demo-kontakt.</p><span class="preview-cta">Be om tilbud</span></div></div><div class="cards"><div class="card"><span>Design</span><strong>Local Pro</strong></div><div class="card"><span>Mobil</span><strong>Optimalisert</strong></div><div class="card"><span>Status</span><strong>Klar</strong></div></div>';
 if(step===2) panel.innerHTML='<h2>AI-resepsjonist</h2><p class="muted">Besøkende får svar og blir ledet til riktig neste steg.</p><div class="chat"><div class="bubble bot">Hei! Hva trenger du hjelp med?</div><div class="bubble user">Vi har en lekkasje på badet og ønsker pris.</div><div class="bubble bot">Jeg kan samle detaljene. Er dette akutt, og hvilket postnummer gjelder det?</div><div class="bubble user">Ikke akutt. 3210.</div></div><div class="cards"><div class="card"><span>Lead</span><strong>Kvalifisert</strong></div><div class="card"><span>Behov</span><strong>Lekkasje</strong></div><div class="card"><span>Neste steg</span><strong>Kontakt</strong></div></div><p class="synthetic">Samtalen og lead-statusen er syntetiske demo-data.</p>';
 if(step===3) panel.innerHTML='<h2>Klar for valg og kjøp</h2><p class="muted">Kunden har sett resultatet før bestilling.</p><div class="ready"><div class="ready-row"><span>Prøveside</span><b class="ok">KLAR</b></div><div class="ready-row"><span>AI-resepsjonist</span><b class="ok">KLAR</b></div><div class="ready-row"><span>Domene + SSL</span><b class="ok">KLAR FOR OPPSETT</b></div></div><div class="price-grid"><div class="price"><span>Basis</span><strong>4 900 kr</strong><small>demo-pris</small></div><div class="price"><span>Standard</span><strong>7 900 kr</strong><small>demo-pris</small></div><div class="price"><span>Premium</span><strong>14 900 kr</strong><small>demo-pris</small></div></div><div class="finish"><strong>15 sek: input → prøveside → AI-bot → kjøpsklar</strong><span>Ingen ekte ordre eller betaling opprettes i denne demoen.</span></div>';
}
let last=-1;
function tick(){
 if(!playing)return;
 const elapsed=Date.now()-started;
 const step=Math.min(3,Math.floor(elapsed/STEP));
 if(step!==last){last=step;render(step)}
 progress.style.width=Math.min(100,elapsed/TOTAL*100)+"%";
 eyebrow.textContent="AUTO DEMO · "+Math.max(0,Math.ceil((TOTAL-elapsed)/1000))+"S IGJEN";
 if(elapsed>=TOTAL){playing=false;progress.style.width="100%";eyebrow.textContent="DEMO FERDIG · 15S";return}
 requestAnimationFrame(tick)
}
document.getElementById("restart").addEventListener("click",()=>{started=Date.now();playing=true;last=-1;tick()});
render(0);tick();
</script>
</body>
